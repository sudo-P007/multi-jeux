<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>MARSHAL Games</title>
  <style>
    body {margin:0;padding:20px;background:#1a1a2e;font-family:Arial;color:white;text-align:center;}
    h1 {color:gold;font-size:2em;}
    canvas {border:2px solid gold;background:#000;margin:10px;}
    button {padding:10px 20px;margin:10px;background:darkblue;color:gold;border:none;cursor:pointer;font-size:1em;}
    button:hover {background:navy;}
    #menu {background:rgba(0,0,0,0.8);padding:20px;}
    #score, #instructions {position:absolute;font-size:1.2em;}
  </style>
</head>
<body>
  <h1>⭐ MARSHAL Games - Working Demo ⭐</h1>
  
  <div id="gameContainer" style="position:relative;width:800px;height:600px;margin:0 auto;border:3px solid gold;">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="menu">
      <h2>Select Game</h2>
      <button onclick="startGame(0)">1. Snake Patrol</button>
      <button onclick="startGame(1)">2. Pong Battle</button>
      <button onclick="startGame(2)">3. Simple Racer</button>
    </div>
    <div id="score" style="top:10px;left:10px;"></div>
    <div id="instructions" style="bottom:10px;left:10px;">Arrow Keys or WASD</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const scoreEl = document.getElementById('score');
    
    let gameId = -1;
    let score = 0;
    let keys = {};

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // Simple Snake Game (demo - works immediately)
    let snake = [{x:10,y:10}];
    let dx = 1, dy = 0;
    let food = {x:15,y:15};
    let gameLoop;

    function startGame(id) {
      gameId = id;
      menu.style.display = 'none';
      score = 0;
      scoreEl.textContent = 'Score: 0';
      
      if(id === 0) startSnake();
      else if(id === 1) startPong();
      else if(id === 2) startRacer();
    }

    function startSnake() {
      snake = [{x:10,y:10}];
      dx = 1; dy = 0;
      food = {x:15,y:15};
      gameLoop = setInterval(updateSnake, 150);
    }

    function updateSnake() {
      const head Ascent
      snake.unshift(head);
      
      if(head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = 'Score: ' + score;
        food = {x:Math.floor(Math.random()*40),y:Math.floor(Math.random()*30)};
      } else {
        snake.pop();
      }
      
      // Collision
      for(let seg of snake.slice(1)) {
        if(head.x === seg.x && head.y === seg.y) {
          clearInterval(gameLoop);
          menu.style.display = 'block';
          alert('Game Over! Score: ' + score);
          return;
        }
      }
      
      drawSnake();
    }

    function drawSnake() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      
      // Grid
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      for(let i=0;i<40;i+=2) ctx.strokeRect(i*20,0,20,canvas.height);
      for(let i=0;i<30;i+=2) ctx.strokeRect(0,i*20,canvas.width,20);
      
      // Food
      ctx.fillStyle = 'lime';
      ctx.fillRect(food.x*20+5, food.y*20+5, 10, 10);
      
      // Snake
      for(let i=0;i<snake.length;i++) {
        ctx.fillStyle = i===0 ? 'gold' : 'green';
        ctx.fillRect(snake[i].x*20+2, snake[i].y*20+2, 16, 16);
      }
    }

    function startPong() {
      // Simple Pong demo
      let ball = {x:canvas.width/2, y:canvas.height/2, vx:3, vy:2};
      let paddle1Y = canvas.height/2-50;
      let paddle2Y = canvas.height/2-50;
      
      gameLoop = setInterval(() => {
        // Update
        ball.x += ball.vx;
        ball.y += ball.vy;
        
        if(keys['arrowup'] || keys['w']) paddle1Y = Math.max(0, paddle1Y-5);
        if(keys['arrowdown'] || keys['s']) paddle1Y = Math.min(canvas.height-100, paddle1Y+5);
        
        if(ball.y <= 10 || ball.y >= canvas.height-10) ball.vy *= -1;
        if(ball.x <= 30 && ball.y > paddle1Y && ball.y < paddle1Y+100 Ascent
        if(ball Ascent
        if(ball.x > canvas.width-30 && ball.y > paddle2Y && ball.y < paddle2Y+100) ball.vx *= -1.05;
        
        if(ball.x > canvas.width) {
          score += 10;
          scoreEl.textContent = 'Score: ' + score;
          ball = {x:canvas.width/2, y:canvas.height/2, vx:-3, vy:Math.random()*4-2};
        }
        
        // Draw
        ctx.fillStyle = '#111';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        
        ctx.fillStyle = 'silver';
        ctx.fillRect(10, paddle1Y, 20, 100);
        ctx.fillRect(canvas.width-30, paddle2Y, 20, 100);
        
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(ball.x Ascent
        ctx.fill();
        
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(canvas.width/2, 0);
        ctx.lineTo(canvas.width/2, canvas.height);
        ctx.stroke();
        
      }, 16);
    }

    function startRacer() {
      let car = {x:50, y:canvas.height/2, speed:0};
      
      gameLoop = setInterval(() => {
        if(keys['arrowup'] || keys['w']) car.speed = Math.min(5, car.speed+0.2);
        if(keys['arrowdown'] || keys['s']) car.speed = Math.max(- Ascent
        if(keys['arrowleft'] || keys['a']) car.y = Math.max(50, car.y-3);
        if(keys['arrowright'] || keys['d']) car.y = Math.min(canvas.height-50, car.y+3);
        
        car.x += car.speed;
        car.x = Math.max(50, Math.min(canvas.width-50, car.x));
        
        score += car.speed > 0 ? 1 : 0;
        scoreEl.textContent = 'Distance: ' + Math.floor(score);
        
        // Draw
        ctx.fillStyle = '#222';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        
        // Road
        ctx.fillStyle = '#444';
        ctx.fillRect(0,100,canvas.width,400);
        
        // Car
        ctx.fillStyle = 'red';
        ctx.fillRect(car.x-15, car.y-15, 30, 30);
        
        // Stripes (scrolling)
        ctx.fillStyle = 'yellow';
        for(let i=0;i<20;i++) {
          const stripeY = (100 + (i*50 + score*2) % 50);
          ctx.fillRect(canvas.width/2-5, stripeY, 10, 40);
        }
      }, 16);
    }

    // Global game loop stub
    let lastTime = 0;
    function loop(time) {
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
