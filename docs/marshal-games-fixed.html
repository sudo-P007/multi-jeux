<!DOCTYPE html>
<html>
<head>
<title>MARSHAL Snake Game - FIXED ⭐</title>
<style>
body{margin:0;padding:20px;background:#222;color:#fff;font-family:Arial;text-align:center;}
canvas{border:2px solid #ffd700;background:#000;}
h1{color:gold;}
#info{position:absolute;top:10px;left:10px;font-size:1.2em;}
</style>
</head>
<body>
<h1>⭐ MARSHAL Snake Game - FIXED! ⭐</h1>
<div id="info">Score: 0 | Arrow Keys / WASD | Refresh to restart</div>
<canvas id="c" width="600" height="400"></canvas>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const info = document.getElementById('info');

let snake = [{x:10,y:10}];
let dx = 1, dy = 0;
let food = {x:15,y:15};
let score = 0;
let keys = {};

document.addEventListener('keydown',e=>{
  e.preventDefault();
  keys[e.key.toLowerCase()] = true;
});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function update() {
  // Direction
  if(keys['arrowleft'] || keys['a']) {dx=-1;dy=0;}
  if(keys['arrowright'] || keys['d']) {dx=1;dy=0;}
  if(keys['arrowup'] || keys['w']) {dx=0;dy=-1;}
  if(keys['arrowdown'] || keys['s']) {dx=0;dy=1;}
  
  const head = {x:snake[0].x+dx, y:snake[0].y+dy};
  snake.unshift(head);
  
  if(head.x === food.x && head.y === food.y) {
    score += 10;
    info.textContent = 'Score: ' + score + ' | Arrow Keys / WASD';
    food = {x:Math.floor(Math.random()*29),y:Math.floor(Math.random()*19)};
  } else snake.pop();
  
  // Collision
  if(head.x<0 || head.x>=30 || head.y<0 || head.y>=20 || snake.slice(1).some(s=>s.x===head.x && s.y===head.y)) {
    alert('Game Over! Score: ' + score);
    location.reload();
    return;
  }
  
  draw();
  setTimeout(update,150);
}

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0,0,c.width,c.height);
  
  // Grid
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  for(let i=0;i<30;i++) ctx.strokeRect(i*20,0,20,c.height);
  for(let i=0;i<20;i++) ctx.strokeRect(0,i*20,c.width,20);
  
  // Food
  ctx.fillStyle = 'lime';
  ctx.fillRect(food.x*20+5,food.y*20+5,10,10);
  
  // Snake
  for(let i=0;i<snake.length;i++) {
    ctx.fillStyle = i===0 ? '#ffd700' : '#00aa00';
    ctx.fillRect(snake[i].x*20+2,snake[i].y*20+2,16,16);
  }
}

update();
</script>
</body>
</html>
